name: CI/CD

on:
    push:
        branches: ['main']
    pull_request:
        branches: ['main']
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
    cancel-in-progress: true

jobs:
    test:
        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
            - uses: actions/checkout@v4
              with:
                  submodules: recursive

            - uses: pnpm/action-setup@v4
              with:
                  version: latest

            - uses: actions/setup-node@v4
              with:
                  node-version: 22.x
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install

            - name: Sync SvelteKit
              run: pnpm exec svelte-kit sync

            - name: Setup mock environment
              run: |
                  echo "127.0.0.1 local.scytta.com" | sudo tee -a /etc/hosts
                  pnpm run mkcert
                  pnpm run env:mock

            - name: Install Playwright browsers
              run: pnpm exec playwright install --with-deps

            - name: Unit tests
              run: pnpm run test:unit --run

            - name: E2E tests
              run: pnpm run test:e2e

    build:
        runs-on: ubuntu-latest
        outputs:
            wrangler_version: ${{ steps.wrangler_version.outputs.version }}
        permissions:
            contents: read

        steps:
            - uses: actions/checkout@v4
              with:
                  submodules: recursive

            - uses: pnpm/action-setup@v4
              with:
                  version: latest

            - uses: actions/setup-node@v4
              with:
                  node-version: 22.x
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install

            - name: Sync SvelteKit
              run: pnpm exec svelte-kit sync

            - name: Select production config
              run: pnpm run env:prod

            - name: Get wrangler version
              id: wrangler_version
              run: |
                  ver=$(pnpm list wrangler --depth=0 --json | jq -r '.[0].devDependencies.wrangler.version')
                  echo "version=$ver" >> $GITHUB_OUTPUT

            - name: Lint and type-check
              run: |
                  pnpm run lint
                  pnpm run check

            - name: Security audit
              run: pnpm audit --audit-level=high --prod

            - name: Build
              run: |
                  pnpm run build
                  pnpm dlx wrangler deploy --dry-run --outdir ./.svelte-kit/cloudflare-tmp
                  cp ./.svelte-kit/cloudflare-tmp/_worker.js ./.svelte-kit/cloudflare/_worker.js

            - name: Collect artifacts
              run: |
                  mkdir -p ./dist
                  cp -r .svelte-kit/cloudflare ./dist/cloudflare
                  jq '.main = "cloudflare/_worker.js" | .assets.directory = "cloudflare"' wrangler.json > ./dist/wrangler.json
                  jq '.main = "cloudflare/_worker.js" | .assets.directory = "cloudflare"' wrangler-dev.json > ./dist/wrangler-dev.json

            - name: Upload artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: spa
                  include-hidden-files: true
                  path: ./dist

    deploy-dev:
        needs: [test, build]
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
            - name: Download artifacts
              uses: actions/download-artifact@v4
              with:
                  name: spa
                  path: ./dist

            - name: Deploy to dev
              id: deploy
              uses: cloudflare/wrangler-action@v3
              with:
                  wranglerVersion: ${{ needs.build.outputs.wrangler_version }}
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  workingDirectory: ./dist
                  command: deploy -c wrangler-dev.json

            - name: Post deployment URL
              env:
                  DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
              run: 'echo "**Deployment url**: <${DEPLOYMENT_URL}>" >> $GITHUB_STEP_SUMMARY'

    deploy-prod:
        needs: [test, build]
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
            - name: Download artifacts
              uses: actions/download-artifact@v4
              with:
                  name: spa
                  path: ./dist

            - name: Deploy to production
              uses: cloudflare/wrangler-action@v3
              with:
                  wranglerVersion: ${{ needs.build.outputs.wrangler_version }}
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  workingDirectory: ./dist
                  command: deploy
