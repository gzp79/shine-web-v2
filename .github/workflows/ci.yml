name: CI

on:
    push:
        branches: ['master']
    pull_request:
        branches: ['master']

# cancel outdated builds
concurrency:
    group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
    cancel-in-progress: true

jobs:
    test:
        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
            - uses: actions/checkout@v4
              with:
                  submodules: recursive

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: latest

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22.x
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm i

            - name: Setup mock environment
              run: |
                  pnpm run mkcert
                  pnpm run env:mock

            - name: Sync SvelteKit
              run: pnpm exec svelte-kit sync

            - name: Install Playwright browsers
              run: pnpm exec playwright install

            - name: Run unit tests
              run: pnpm run test:unit --run

            - name: Run E2E tests
              run: pnpm run test:e2e

    build:
        runs-on: ubuntu-latest
        outputs:
            wrangler_version: ${{ steps.pre_build.outputs.wrangler_version }}
        permissions:
            contents: read

        steps:
            - uses: actions/checkout@v4
              with:
                  submodules: recursive

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: latest

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22.x
                  cache: 'pnpm'

            - name: Prepare
              id: pre_build
              run: |
                  pnpm i
                  pnpm run mkcert
                  pnpm run env:prod
                  ver=$(pnpm list wrangler --depth=0 --json 2>/dev/null | jq -r '.[] | (.devDependencies.wrangler.version // .dependencies.wrangler.version) | select(.)' 2>/dev/null | head -n1)
                  echo "wrangler_version=$ver" >> $GITHUB_OUTPUT

            - name: Sync SvelteKit
              run: pnpm exec svelte-kit sync

            - name: Lint and check
              run: |
                  pnpm run lint
                  pnpm run check

            - name: Audit
              run: pnpm audit --audit-level=high --prod

            - name: Build
              run: |
                  pnpm run build
                  pnpm dlx wrangler deploy --dry-run --outdir ./.svelte-kit/cloudflare-tmp
                  cp ./.svelte-kit/cloudflare-tmp/_worker.js ./.svelte-kit/cloudflare/_worker.js

            - name: Collect artifacts
              run: |
                  mkdir -p ./dist
                  cp -r .svelte-kit/cloudflare ./dist/cloudflare
                  jq '.main = "cloudflare/_worker.js" | .assets.directory = "cloudflare"' wrangler.json > ./dist/wrangler.json
                  jq '.main = "cloudflare/_worker.js" | .assets.directory = "cloudflare"' wrangler-dev.json > ./dist/wrangler-dev.json

            - name: Upload artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: spa
                  include-hidden-files: true
                  path: ./dist

    deploy-dev:
        needs: [test, build]
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
            - name: Download artifacts
              uses: actions/download-artifact@v4
              with:
                  name: spa
                  path: ./dist

            - name: Deploy to dev
              id: deploy
              uses: cloudflare/wrangler-action@v3
              with:
                  wranglerVersion: ${{ needs.build.outputs.wrangler_version }}
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  workingDirectory: ./dist
                  command: deploy -c wrangler-dev.json

            - name: Post deployment URL
              env:
                  DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
              run: 'echo "**Deployment url**: <${DEPLOYMENT_URL}>" >> $GITHUB_STEP_SUMMARY'

    deploy-prod:
        needs: [test, build]
        if: github.ref == 'refs/heads/master'
        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
            - name: Download artifacts
              uses: actions/download-artifact@v4
              with:
                  name: spa
                  path: ./dist

            - name: Publish site
              uses: cloudflare/wrangler-action@v3
              with:
                  wranglerVersion: ${{ needs.build.outputs.wrangler_version }}
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
                  workingDirectory: ./dist
                  command: deploy
